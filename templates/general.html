{{define "content"}}
<tr>
  <td style="padding:40px 48px;" class="pd-mobile">
    <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#374151; line-height:1.8;">
      Hi <strong style="color:#0f172a;">{{.Name}}</strong>,
    </p>
    <p style="margin:16px 0 0 0; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#64748b; line-height:1.8;">
      {{.Content}}
    </p>
  </td>
</tr>
{{end}}
