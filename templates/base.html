<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{.Subject}}</title>
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { -ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; }
    body { margin:0 !important; padding:0 !important; width:100% !important; }
    @media screen and (max-width:620px) {
      .email-container { width:100% !important; }
      .pd-mobile { padding:24px 20px !important; }
      .pd-btn-mobile { padding:13px 24px !important; }
      .font-mobile { font-size:20px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#e5e5e5; word-spacing:normal;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
    style="background-color:#e5e5e5; margin:0; padding:0;">
    <tr>
      <td align="center" style="padding:40px 12px;">
        <table role="presentation" class="email-container" cellspacing="0" cellpadding="0" border="0"
          width="600" style="background-color:#ffffff; border-radius:4px; overflow:hidden;">

          <!-- TOP ACCENT BAR -->
          <tr>
            <td height="4" style="background:linear-gradient(90deg,#1d4ed8 0%,#3b82f6 100%); font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <!-- HEADER -->
          <tr>
            <td style="background-color:#ffffff; padding:32px 48px 24px 48px; border-bottom:1px solid #f1f5f9;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td valign="middle">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td style="background-color:#1d4ed8; border-radius:8px; padding:8px 14px;" valign="middle">
                          <span style="font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:700; color:#ffffff; letter-spacing:0.5px; line-height:1;">
                            {{.SiteName}}
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- DYNAMIC CONTENT -->
          {{template "content" .}}

          <!-- FOOTER -->
          <tr>
            <td style="background-color:#f8fafc; padding:28px 48px; border-top:1px solid #f1f5f9;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center">
                    <p style="margin:0 0 6px 0; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#94a3b8; line-height:1.5;">
                      This email was sent by <strong style="color:#64748b;">{{.SiteName}}</strong>.
                    </p>
                    <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:11px; color:#94a3b8; line-height:1.5;">
                      &copy; {{.Year}} {{.SiteName}}. All rights reserved.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
